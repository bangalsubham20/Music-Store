<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 60" width="100%" height="60">
  <defs>
    <linearGradient id="eqBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="35%" stop-color="#3b82f6" />
      <stop offset="65%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="waveGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @keyframes wavePulse {
        0%, 100% { transform: scaleY(0.4); opacity: 0.6; }
        50% { transform: scaleY(1.1); opacity: 1; }
      }
      .w-bar {
        transform-origin: bottom;
        animation: wavePulse 1.2s ease-in-out infinite alternate;
      }
    </style>
  </defs>
  <g fill="url(#eqBarGrad)" filter="url(#waveGlow)" transform="translate(10, 0)">
    <!-- 40 Animated Frequency Spectrum Bars with staggered animation delays -->
    <rect class="w-bar" style="animation-delay: 0.1s" x="0" y="25" width="8" height="30" rx="3"/>
